<button class="btn" onclick="memorySave()">MS</button>
<button class="btn" onclick="memoryRecall()">MR</button>
<button class="btn" onclick="memoryClear()">MC</button>
<button class="btn" onclick="appendToDisplay('Math.sqrt(')">√</button>
<button class="btn" onclick="appendToDisplay('**')">^</button>

<script>
    let memory = 0;

    function memorySave() {
        memory = parseFloat(document.getElementById('display').value) || 0;
    }

    function memoryRecall() {
        document.getElementById('display').value += memory;
    }

    function memoryClear() {
        memory = 0;
    }

    function clearHistory() {
        document.getElementById('historyList').innerHTML = '';
    }

    document.addEventListener('keydown', (event) => {
        let key = event.key;
        if (!isNaN(key) || ['+', '-', '*', '/', '.'].includes(key)) {
            appendToDisplay(key);
        } else if (key === 'Enter') {
            calculate();
        } else if (key === 'Backspace') {
            deleteChar();
        }
    });
</script>
